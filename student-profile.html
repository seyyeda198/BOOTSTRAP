<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-profile</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <div class="container">
    <div class="row">
    <h1 class="col-12 display-3" style="text-align: center; background-color: antiquewhite;"><b>Student Profile</b></h1>
    </div>
        <div class="row">
                <blockquote class=" col-sm-12 blockquote" style="background-color:lightgrey;"><b>Learning never exhausts the mind.</b></blockquote>
                <img src="PROFILE.jpg" width="200" height="200" alt="profile" class="mx-auto d-block rounded-circle">
        <div class="table-responsive">
            <table class="table table-striped" style="margin-top:50px;">
                <thead class="thead-dark">
                    <tr>
                        <th>SUBJECT</th>
                        <th>MARK</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>English</td>
                        <td>90</td>
                    </tr>
                    <tr>
                        <td>Maths</td>
                        <td>88</td>
                    </tr>
                    <tr>
                        <td>Science</td>
                        <td>95</td>
                    </tr>
                </tbody>
            </table>
        </div>
            <div class="col-12 alert alert-success">Profile Updated <strong>Successfully!</strong></div>
        </div>
    </div>
    
</body>
</html>
