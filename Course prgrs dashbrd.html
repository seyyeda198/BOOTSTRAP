<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container">
<ul class = "breadcrumb">
   <li class = "breadcrumb-item"><a href = "#">Home</a></li>
   <li class = "breadcrumb-item"><a href="#">Courses</a></li>
   <li class = "breadcrumb-item active" aria-current = "page">Web Development</li>
</ul>
    <h1 style="text-align: center;">Web Development Course<span class = "badge badge-info">New</span></h1><br>
<div class="progress" style="height: 30px;">
     <div class="progress-bar progress-bar-striped bg-success" style="width:100%"><b>HTML-100%</b></div>
</div><br>
<div class="progress" style="height: 30px;">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width:75%"><b>CSS-75%</b></div>
</div><br>
<div class="progress" style="height: 30px;">
     <div class="progress-bar" style="width:50%; background-color:orange"><b>JavaScript-50%</b></div>
</div><br>
<div class="progress"style="height: 30px;">
     <div class="progress-bar bg-danger" style="width:25%"><b>Bootstrap-25%</b></div>
</div><br>
<div class="text-center">
<div class="btn-group">
<button type = "button" class = "btn btn-success">Start</button>
<button type = "button" class = "btn btn-primary">Pause</button>
<button type = "button" class = "btn btn-danger">Reset</button>
</div></div><br>
<ul class="pagination justify-content-center">
  <li class="page-item active"><a class="page-link" href="#">1</a></li>
  <li class="page-item"><a class="page-link" href="#">2</a></li>
  <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
</ul>
</div>
    
</body>
</html>
