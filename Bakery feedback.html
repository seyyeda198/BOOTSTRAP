<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Feedback</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
   <div class="container">
            <h4 class="text-center mb-4 mt-2" style="font-family: 'Times New Roman', Times, serif;"><b>Customer Feedback Form</b></h4>
    <div class="form-group">
        <label for="text">Name:</label>
        <input type="text" class="form-control" id="text" placeholder="Enter your Name" name="text">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="form-group">
    <label for="comment">Feedback:</label>
        <textarea class="form-control" rows="3" id="comment" placeholder="Share Your Feedback"></textarea>
    </div>
    <label class="mt-1">Preferred Contact Method:</label>  
      <div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input "name="optradio">Email
  </label>
</div>
<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input"name="optradio" >Phone
  </label>
</div>
<label class="mt-2">Satisfaction Level:1-10</label>
<div class="form-group">
  <input type="range" class="form-control-range" name="range">
    </div>
    <div class="form-group">
    <label for="orderType">Type of Order:</label>
    <select class="form-control" id="orderType">
    <option>Select order type</option>
    <option>Cake</option>
    <option>Cookies</option>
    <option>Pastries</option>
    </select>
    </div>
<button type = "button" class = "btn btn-primary mt-3">submit</button>
   </div> 
</body>
</html>
