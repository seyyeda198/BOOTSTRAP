<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h4 class="text-center mb-4 mt-2" style="font-family: 'Times New Roman', Times, serif;"><b>Feedback Form</b></h4>
    <div class="form-group">
        <label for="text">Name:</label>
        <input type="text" class="form-control" id="text" placeholder="Enter your Name" name="text">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="form-group">
    <label for="comment">Feedback:</label>
        <textarea class="form-control" rows="3" id="comment" placeholder="Share Your Feedback"></textarea>
    </div>
        <div class="form-group">
    <label for="orderType">How DidYou Find Us?</label>
    <select class="form-control" id="orderType">
    <option>Select</option>
    <option>Social Media</option>
    <option>Advertisement</option>
    <option>Website</option>
    <option>Others</option>
    </select>
    </div>
    <label class="mt-1">Level Of Satisfaction:</label>  
      <div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input "name="optradio">1
  </label>
</div>
<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input"name="optradio" >2
  </label>
</div>
<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input" name="optradio">3
  </label>
</div>
<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input" name="optradio">4
  </label>
</div>  
<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input" name="optradio">5
  </label>
</div>    
<button type = "button" class = "btn btn-info mt-3">submit</button>

 </div>

</body>
</html>
